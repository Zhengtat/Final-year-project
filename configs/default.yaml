# Default configuration for cumap. Values here are overridden by environment variables
# where noted (model names, API key, backend).
version: 0
seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_gold: data/gold
  data_processed: data/processed
  data_cache: data/cache
  data_logs: data/logs
  reports: reports
  prompts: prompts

textbook:
  repo_url: "https://github.com/SystemsApproach/book"
  clone_dir: data/raw/textbook/pd6
  # Filled in by `cumap textbook fetch` (M1) and logged in DECISIONS.md.
  pinned_commit: 5deec5e741e2b8c0bc44566108a24cb783c2c7de

llm:
  # Model names default here but are read from OPENAI_MODEL_STRONG / OPENAI_MODEL_BULK if set.
  model_strong: gpt-6-astra
  model_bulk: gpt-6-luna
  # gpt-6-astra does not support reasoning effort "none"; use "low" as its floor.
  reasoning_effort:
    concept_extraction: low
    relation_extraction: low
    propositions: medium
    judging: medium
    per_answer_labelling: low
    student_extraction: low
  max_usd_per_command: 5
  # PLACEHOLDER pricing for --dry-run cost estimates: gpt-6-astra/gpt-6-luna have no
  # published per-token price we know of. Confirm real pricing before trusting these
  # numbers for anything but a rough order-of-magnitude check.
  assumed_usd_per_1k_input_tokens: 0.002
  assumed_usd_per_1k_output_tokens: 0.008

embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2

# Approved 2026-09-28 by the 👤 HUMAN after M1's coverage review (see docs/DECISIONS.md
# for the selection criteria: direct textbook verification + train-split label spread,
# not a literature-based selection).
pilot_questions:
  - q_ad9ae0e3  # Piggybacking requirement (sliding window) -> 2.5 Reliable Transmission
  - q_57a5b057  # Transparent bridges / bridge table -> 3.2 Switched Ethernet (§3.2.1 Learning Bridges)
  - q_cc7ede94  # IPv6 extension headers -> 4.2 IP Version 6
  - q_58c81db9  # Reverse Path Forwarding/Broadcast -> 4.3 Multicast
  - q_582d0a1c  # TCP congestion control phases -> 6.3 TCP Congestion Control + 6.4 Advanced Congestion Control
