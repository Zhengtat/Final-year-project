# Default configuration for cumap. Values here are overridden by environment variables
# where noted (model names, API key, backend).
version: 0
seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_gold: data/gold
  data_processed: data/processed
  data_cache: data/cache
  data_logs: data/logs
  reports: reports
  prompts: prompts

textbook:
  repo_url: "https://github.com/SystemsApproach/book"
  clone_dir: data/raw/textbook/pd6
  # Filled in by `cumap textbook fetch` (M1) and logged in DECISIONS.md.
  pinned_commit: 5deec5e741e2b8c0bc44566108a24cb783c2c7de

# CR-001: default registry is now v1 (16 relations, 6 families + pedagogical).
# relations_v0.yaml stays loadable (RelationRegistry.from_yaml accepts either file);
# registry_version_supported documents which versions cumap gold validate accepts.
relation_registry: configs/relations_v1.yaml
registry_version_supported: [0, 1]

llm:
  # CR-001 §8: strong tier changed gpt-6-astra -> gpt-6-sol (verified working at
  # low/medium reasoning effort, 2026-09-28 — see DECISIONS.md). gpt-6-astra is now
  # a "ceiling" tier: opt-in only (e.g. a model bake-off), never a default model_tier
  # anywhere in the code. Models are read from OPENAI_MODEL_STRONG / _BULK / _CEILING
  # if those env vars are set.
  # Per-tier pricing (CR-005 §2 step 3), USD per 1M tokens. Confirmed against OpenAI's
  # current published pricing 2026-09-29 (see DECISIONS.md): Sol $2 in / $10 out, Luna
  # $0.10 in / $0.50 out — exact match, no discrepancy. Cached input reads get a 90%
  # discount ($0.20 Sol / $0.01 Luna) that this estimator doesn't yet account for.
  # ceiling (gpt-6-astra) has no confirmed price — opt-in only, unused by the demo slice.
  tiers:
    strong:  {model: gpt-6-sol,   reasoning_effort: medium, usd_per_1m_input_tokens: 2.0,  usd_per_1m_output_tokens: 10.0}
    bulk:    {model: gpt-6-luna,  reasoning_effort: low,    usd_per_1m_input_tokens: 0.10, usd_per_1m_output_tokens: 0.50}
    ceiling: {model: gpt-6-astra, reasoning_effort: low}  # gpt-6-astra can't do effort "none"; "low" is its floor. No price yet.
  # Per-task effort overrides the task's tier default above (e.g. expert_subgraph
  # warrants more care than the average strong-tier call). Unlisted tasks use their
  # tier's default effort.
  reasoning_effort_overrides:
    concept_extraction: low
    relation_extraction: low
    propositions: medium
    judging: medium
    per_answer_labelling: low
    student_extraction: low
    expert_subgraph: medium
    student_graph_draft: low
  escalation:
    enabled: true
    from_tier: bulk
    to_tier: strong
    when: [schema_error, evidence_check_failed, low_confidence]
    confidence_threshold: 0.6
  # CR-005 §2 step 5: raised from $5 after the owner's scope-reduction decision
  # (P&D cut to ch2-3; see configs/demo_slice.yaml, DECISIONS.md) brought the
  # measured re-estimate for the demo slice to ~$24.99, comfortably under this cap.
  max_usd_per_command: 15
  # PLACEHOLDER pricing for --dry-run cost estimates: none of gpt-6-sol/luna/astra
  # have a published per-token price we know of. Confirm real pricing before trusting
  # these numbers for anything but a rough order-of-magnitude check.
  assumed_usd_per_1k_input_tokens: 0.002
  assumed_usd_per_1k_output_tokens: 0.008
  assumed_batch_discount: 0.5  # CR-003 §13's rough note: "--batch roughly halves the cost"
  # CR-005 §9: per-stage budgets, checked inside LLMClient.parse before every call
  # (spend so far + this call's worst case must stay under the applicable cap), not
  # just a pre-run estimate. null = no stage-specific cap, falls back to
  # max_usd_per_command only. These are conservative global defaults; a specific run
  # (e.g. "IIR dev concepts, approved if <= $2") passes a tighter override explicitly
  # rather than editing this file per run.
  stage_budgets_usd:
    concepts: null
    canonicalize: null
    relations: null
  # Worst-case output-token bound per task: used for the pre-call budget check AND
  # passed to the real API as max_output_tokens, so a single call can't blow past this
  # regardless of how much the model wants to reason (the direct cause of the $14.03
  # IIR-dev overrun on 2026-09-29 -- see DECISIONS.md). Generous relative to measured
  # averages (concept_extraction ~964, canonicalize ~145, relation_family ~172,
  # relation_choice ~310, relation_qualifiers ~307 incl. reasoning) so legitimate
  # longer answers aren't truncated, but bounded so nothing is open-ended.
  # concept_extraction raised 2000 -> 3500 -> 8000 on 2026-09-29: v2's prompt (STOP-2
  # dev ablation) deliberately extracts more concepts (keeps short domain terms,
  # splits coordinations), which hit each ceiling mid-JSON-string in turn -- first on
  # IIR (dense short sections), then on P&D (some sections up to 11,700 words, e.g.
  # 3.3 -- far longer than any IIR dev/test section). Both caught immediately
  # (invalid-JSON error, not a silent bad result); $0.03 + $0.01 wasted, not a lot.
  max_output_tokens:
    concept_extraction: 8000
    concept_extraction_gleaning: 1500
    canonicalize: 300
    relation_family: 400
    relation_choice: 500
    relation_qualifiers: 400
    default: 1000

embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2

# Approved 2026-09-28 by the 👤 HUMAN after M1's coverage review (see docs/DECISIONS.md
# for the selection criteria: direct textbook verification + train-split label spread,
# not a literature-based selection).
pilot_questions:
  - q_ad9ae0e3  # Piggybacking requirement (sliding window) -> 2.5 Reliable Transmission
  - q_57a5b057  # Transparent bridges / bridge table -> 3.2 Switched Ethernet (§3.2.1 Learning Bridges)
  - q_cc7ede94  # IPv6 extension headers -> 4.2 IP Version 6
  - q_58c81db9  # Reverse Path Forwarding/Broadcast -> 4.3 Multicast
  - q_582d0a1c  # TCP congestion control phases -> 6.3 TCP Congestion Control + 6.4 Advanced Congestion Control
