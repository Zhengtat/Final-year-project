# Relation registry v1.4.1: GENERATED by cumap.schemas.registry_patch from relations_v1.4.yaml + CR-046-relations-v1.4.1.yaml (CR-007).
# CR-046 (2026-10-24): v1.4 with the owner-approved CR-040 wording for its six SciNLP-derived relations (docs/cr040/v14_wording_proposals.yaml). Wording only: no relation, family, type or flag changes. measured_by and evaluated_by both kept (option A, the wording the owner approved).
# Do not hand-edit: change the patch file and regenerate. relations_v1.4.yaml is unchanged.
# Base design notes (families, qualifier rules, template/near-miss guideline design) live in relations_v1.4.yaml.

version: 1
supersedes: 0
node_types:
- Protocol
- Mechanism
- Component
- DataUnit
- Parameter
- Property
- Event
- State
- Layer
- Concept
- Identifier
qualifiers:
  polarity:
    values:
    - affirmed
    - negated
    applies_to: all
    required: true
  modality:
    values:
    - necessary
    - always
    - typically
    - possible
    - never
    applies_to: all
    required: true
  conditions:
    type: list[concept_id | str]
    applies_to: all
    required: false
  surface_phrase:
    type: str
    applies_to: all
    required: 'student edges: yes; expert edges: when LLM-extracted'
    note: the linking words exactly as written in the source (e.g. 'is used to', 'doubles')
  part_type:
    values:
    - component
    - member
    - phase
    applies_to:
    - part_of
    required: true
    note: transitive inference only within the same part_type (Winston et al. 1987)
  dimension:
    type: str
    applies_to:
    - contrasts_with
    required: recommended
    note: what differs, e.g. 'clock recovery', 'cwnd growth rate'
  action_type:
    values:
    - send
    - receive
    - forward
    - transform
    - check
    - store
    - drop
    - generate
    - other
    applies_to:
    - acts_on
    required: true
    note: Closed list for the verb class. Keep the exact verb in surface_phrase (e.g. 'retransmits' -> send).
families:
- name: mechanism_process
  label: Mechanism & process
  diagnostic_prior: 1.0
  grounding: SBF behaviour; mechanistic reasoning; PDTB Temporal
  gloss: 'something acts or happens: an actor performs, triggers or precedes an activity, or handles a data unit
    (send, receive, forward, transform, check, store, drop)'
- name: cause_effect
  label: Cause & quantitative effect
  diagnostic_prior: 1.0
  grounding: PDTB Contingency.Cause; SemEval Cause-Effect; Qualitative Process Theory
  gloss: one thing brings about, prevents or changes the amount of another
- name: function_means
  label: Function & means
  diagnostic_prior: 0.8
  grounding: Qualia telic; SBF function; ConceptNet UsedFor
  gloss: what something is for, or what it uses to achieve its purpose
- name: dependency
  label: Dependency & constraint
  diagnostic_prior: 0.8
  grounding: PDTB Condition; ConceptNet HasPrerequisite
  gloss: one thing needs, requires or is constrained by another (including a stated absence of that need)
- name: comparison
  label: Comparison
  diagnostic_prior: 0.7
  grounding: Chaffin & Herrmann contrast family; PDTB Comparison
  gloss: two things are alike, different or in tension along a stated dimension
- name: classification_structure
  label: Classification & structure
  diagnostic_prior: 0.6
  grounding: WordNet; Winston et al.; qualia formal/constitutive; SBF structure
  gloss: what kind of thing something is, what it is made of, what it is attached or connected to, what carries
    or names it
- name: evaluation
  label: Evaluation & measurement
  diagnostic_prior: 0.6
  grounding: SciNLP (EMNLP 2025) MeasuredBy / evaluatedBy / evaluatedOn; benchmark practice
  gloss: how something is measured or tested, and on which data
- name: pedagogical
  label: Pedagogical
  diagnostic_prior: 0.0
  grounding: PREAP; prerequisite literature (not used for correctness)
relations:
- name: performs
  family: mechanism_process
  layer: semantic
  status: new_in_v1
  definition: Actor/component/protocol source carries out activity target (an operation, procedure or algorithm
    step).
  template: '{X} performs {Y}'
  examples:
  - transparent bridge performs backward learning of source addresses
  - TCP sender performs fast retransmit
  near_misses:
  - relation: uses
    example: TCP uses sliding window
    why: sliding window is a means/structure, not an activity the actor carries out
  - relation: triggers
    example: three duplicate ACKs triggers fast retransmit
    why: the source is an event, not an actor
  domain_types:
  - Protocol
  - Component
  - Mechanism
  range_types:
  - Mechanism
  - Event
  directional: true
  symmetric: false
  transitive: false
  inverse_of: performed_by
  conflicts_with: []
  compatible_with:
    uses: partial
- name: triggers
  family: mechanism_process
  layer: semantic
  definition: By protocol rule, event/state source initiates action or state change target. Put the context in conditions.
  template: '{X} triggers {Y}'
  examples:
  - timeout triggers cwnd reset to 1 MSS
  - three duplicate ACKs triggers fast retransmit
  near_misses:
  - relation: causes
    example: simultaneous transmission causes a collision
    why: a physical/logical consequence, not a designed protocol rule
  - relation: precedes
    example: slow start precedes congestion avoidance
    why: ordering only; the first does not initiate the second by rule
  domain_types:
  - Event
  - State
  range_types:
  - Mechanism
  - State
  - Event
  - Parameter
  directional: true
  symmetric: false
  transitive: false
  inverse_of: triggered_by
  conflicts_with: []
  compatible_with:
    causes: partial
- name: precedes
  family: mechanism_process
  layer: semantic
  definition: In a process or protocol, step/phase source happens before step/phase target.
  template: '{X} happens before {Y}'
  examples:
  - slow start precedes congestion avoidance
  - SYN precedes SYN-ACK
  near_misses:
  - relation: triggers
    example: timeout triggers retransmission
    why: the first initiates the second; use triggers
  - relation: part_of
    example: slow start part_of[phase] TCP congestion control
    why: membership of a phase in a process, not order
  domain_types:
  - State
  - Event
  - Mechanism
  range_types:
  - State
  - Event
  - Mechanism
  directional: true
  symmetric: false
  transitive: true
  inverse_of: follows
  conflicts_with: []
  compatible_with: {}
- name: acts_on
  family: mechanism_process
  layer: semantic
  status: new_in_v1_1
  gate: core
  definition: 'Component, protocol or mechanism source does something to data unit target: sends, receives, forwards,
    transforms, checks, stores, drops or generates it. The verb class goes in action_type; the exact verb in surface_phrase.'
  template: '{X} handles {Y} (sends, receives, forwards, transforms, checks, stores or drops it)'
  examples:
  - the switch forwards the frame out of one port -> switch acts_on frame (forward)
  - 'the sender retransmits the frame after a timeout -> sender acts_on frame (send; conditions: timeout)'
  - the adaptor encodes the bits using Manchester encoding -> adaptor acts_on bit (transform)
  - 'the receiver discards corrupted frames -> receiver acts_on frame (drop; conditions: CRC error)'
  near_misses:
  - relation: performs
    example: transparent bridge performs backward learning
    why: the target is an activity, not a thing being handled
  - relation: uses
    example: TCP uses sequence numbers
    why: a means the actor relies on, not an object it acts on
  domain_types:
  - Component
  - Protocol
  - Mechanism
  - Layer
  range_types:
  - DataUnit
  - Concept
  directional: true
  symmetric: false
  transitive: false
  inverse_of: acted_on_by
  conflicts_with: []
  compatible_with:
    performs: partial
- name: causes
  family: cause_effect
  layer: semantic
  definition: Source brings about target as a consequence (not a designed protocol rule).
  template: '{X} causes {Y}'
  examples:
  - simultaneous transmission causes a collision
  - packet loss causes throughput drop
  near_misses:
  - relation: triggers
    example: timeout triggers cwnd reset
    why: designed protocol rule; use triggers
  - relation: has_purpose
    example: carrier extension has_purpose reliable collision detection
    why: intended goal, not a side-effect
  domain_types:
  - Any
  range_types:
  - Event
  - State
  - Property
  directional: true
  symmetric: false
  transitive: true
  inverse_of: caused_by
  conflicts_with:
  - prevents
  compatible_with:
    triggers: partial
    has_purpose: partial
- name: prevents
  family: cause_effect
  layer: semantic
  definition: Source stops or avoids target from happening.
  template: '{X} prevents {Y}'
  examples:
  - spanning tree prevents forwarding loops
  - sequence numbers prevent duplicate delivery
  near_misses:
  - relation: decreases
    example: frame bursting decreases per-frame overhead
    why: reduces a quantity rather than stopping an event
  domain_types:
  - Any
  range_types:
  - Event
  - State
  - Property
  directional: true
  symmetric: false
  transitive: false
  inverse_of: null
  conflicts_with:
  - causes
  compatible_with:
    decreases: partial
- name: increases
  family: cause_effect
  layer: semantic
  definition: More/activation of source raises the value of target (qualitative proportionality +). Advantages/disadvantages
    = increases/decreases on quality attributes (throughput, delay, overhead, efficiency).
  template: '{X} increases {Y}'
  examples:
  - each ACK during slow start increases cwnd
  - frame bursting increases channel efficiency
  - longer cable increases propagation delay
  near_misses:
  - relation: causes
    example: packet loss causes throughput drop
    why: an event outcome rather than a monotonic quantity relation
  domain_types:
  - Any
  range_types:
  - Parameter
  - Property
  directional: true
  symmetric: false
  transitive: false
  inverse_of: null
  conflicts_with:
  - decreases
  compatible_with: {}
- name: decreases
  family: cause_effect
  layer: semantic
  definition: More/activation of source lowers the value of target (qualitative proportionality −).
  template: '{X} decreases {Y}'
  examples:
  - triple duplicate ACK decreases cwnd (halves it in Reno)
  - frame bursting decreases per-frame overhead
  near_misses:
  - relation: prevents
    example: spanning tree prevents loops
    why: stops an event entirely
  domain_types:
  - Any
  range_types:
  - Parameter
  - Property
  directional: true
  symmetric: false
  transitive: false
  inverse_of: null
  conflicts_with:
  - increases
  compatible_with:
    prevents: partial
- name: has_purpose
  family: function_means
  layer: semantic
  status: new_in_v1
  definition: Source (a designed mechanism, protocol, field or component) exists or is used in order to achieve
    goal target.
  template: '{X} exists in order to achieve {Y}'
  examples:
  - carrier extension has_purpose reliable collision detection at gigabit speed
  - spanning tree algorithm has_purpose loop-free forwarding topology
  - IPv6 extension headers has_purpose optional functionality without enlarging the base header
  near_misses:
  - relation: uses
    example: TCP uses sliding window
    why: the target is the means, not the goal
  - relation: causes
    example: packet loss causes throughput drop
    why: unintended consequence, not a designed goal
  domain_types:
  - Protocol
  - Mechanism
  - Component
  - DataUnit
  - Parameter
  range_types:
  - Property
  - State
  - Concept
  - Event
  directional: true
  symmetric: false
  transitive: false
  inverse_of: achieved_by
  conflicts_with: []
  compatible_with:
    causes: partial
  external_labels:
    SciNLP:
    - UsedFor
- name: uses
  family: function_means
  layer: semantic
  definition: Source employs target as a means, mechanism or data structure to do its job.
  template: '{X} uses {Y}'
  examples:
  - TCP uses sliding window
  - transparent bridge uses a forwarding table
  near_misses:
  - relation: requires
    example: CSMA/CD requires a minimum frame length
    why: a constraint that must hold, not a tool employed
  - relation: performs
    example: bridge performs backward learning
    why: an activity carried out, not a means
  domain_types:
  - Protocol
  - Mechanism
  - Component
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: false
  inverse_of: used_by
  conflicts_with: []
  compatible_with:
    requires: partial
    performs: partial
  external_labels:
    SciNLP:
    - trainedWith
- name: enhanced_by
  family: function_means
  layer: semantic
  definition: Source is a method, model or system whose performance or capability is improved by an add-on technique
    named by target. The sentence must present the target as an addition to, or a modification of, the source, not
    as a basic part or an ordinary means.
  template: '{X} is enhanced by {Y}'
  examples:
  - an encoder-decoder model enhanced_by an attention mechanism
  - a classifier enhanced_by data augmentation
  - TCP enhanced_by selective acknowledgments
  near_misses:
  - relation: uses
    example: TCP uses sliding window
    why: the target is a basic means, not an add-on that improves it
  - relation: increases
    example: a larger window increases throughput
    why: a quantity change, not an added technique
  - relation: part_of
    example: the encoder part_of[component] the encoder-decoder model
    why: a structural component of the source, not an add-on
  - relation: requires
    example: TLS requires a certificate
    why: a dependency, not an improvement
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: false
  inverse_of: enhances
  conflicts_with: []
  compatible_with:
    uses: partial
  external_labels:
    SciNLP:
    - enhancedBy
- name: requires
  family: dependency
  layer: semantic
  definition: Source cannot work or be valid unless target holds (a technical dependency or constraint). Put the
    context in conditions.
  template: '{X} cannot work unless {Y}'
  examples:
  - CSMA/CD collision detection requires a minimum frame length
  - piggybacking requires bidirectional data flow
  near_misses:
  - relation: uses
    example: TCP uses sliding window
    why: a means employed, not a precondition
  - relation: prerequisite_of
    example: sliding window prerequisite_of TCP flow control
    why: a learning dependency, not a technical one
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: false
  inverse_of: null
  conflicts_with: []
  compatible_with:
    uses: partial
- name: is_a
  family: classification_structure
  layer: taxonomy
  definition: Source is a kind/subtype of target.
  template: '{X} is a kind of {Y}'
  examples:
  - CSMA/CD is_a medium access protocol
  - Manchester encoding is_a line encoding scheme
  near_misses:
  - relation: part_of
    example: extension header part_of IPv6 packet
    why: a component, not a subtype
  - relation: has_property
    example: Manchester encoding has_property self-clocking
    why: an attribute, not a category
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: true
  inverse_of: has_subtype
  conflicts_with: []
  compatible_with: {}
  external_labels:
    SciNLP:
    - subclassOf
- name: part_of
  family: classification_structure
  layer: taxonomy
  definition: 'Source is a part of target. REQUIRED qualifier part_type: component (field/module of a structured
    whole), member (element of a collection/group), phase (step/stage of a process).'
  template: '{X} is part of {Y}'
  examples:
  - extension header part_of[component] IPv6 packet
  - host part_of[member] collision domain
  - slow start part_of[phase] TCP congestion control
  near_misses:
  - relation: is_a
    example: CSMA/CD is_a MAC protocol
    why: a subtype, not a part
  - relation: precedes
    example: slow start precedes congestion avoidance
    why: ordering between phases, not membership
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: within_same_part_type
  inverse_of: has_part
  conflicts_with: []
  compatible_with: {}
  external_labels:
    SciNLP:
    - partOf
- name: has_property
  family: classification_structure
  layer: semantic
  definition: Source has the characteristic, behaviour, value or constraint named by target.
  template: '{X} has the property {Y}'
  examples:
  - slow start has_property exponential cwnd growth
  - Manchester encoding has_property self-clocking
  - reserved Class A address 127.0.0.0/8 has_property loopback
  near_misses:
  - relation: has_purpose
    example: carrier extension has_purpose collision detection
    why: a designed goal, not an attribute
  - relation: increases
    example: frame bursting increases efficiency
    why: an effect on a quantity, not a static attribute
  domain_types:
  - Any
  range_types:
  - Property
  - Parameter
  directional: true
  symmetric: false
  transitive: false
  inverse_of: null
  conflicts_with: []
  compatible_with: {}
- name: connected_to
  family: classification_structure
  layer: semantic
  status: new_in_v1_1
  gate: core
  definition: Component source is physically or logically linked to component target so the two can exchange data
    directly (network topology).
  template: '{X} is directly connected to {Y}'
  examples:
  - hosts are connected to the switch by point-to-point links -> host connected_to switch
  - a bridge connects two LAN segments -> bridge connected_to LAN segment
  near_misses:
  - relation: part_of
    example: the link is part of the network
    why: membership in a whole, not adjacency between peers
  - relation: uses
    example: the host uses the link
    why: use of a resource, not a topological connection
  domain_types:
  - Component
  - Concept
  range_types:
  - Component
  - Concept
  directional: false
  symmetric: true
  transitive: false
  inverse_of: connected_to
  conflicts_with: []
  compatible_with: {}
- name: subtask_of
  family: classification_structure
  layer: taxonomy
  definition: Source is a narrower task, problem or function that belongs under the broader task named by target,
    in a task hierarchy (source is one of the ways or parts of getting the target task done). Both ends are tasks
    or problems, not methods, components or data.
  template: '{X} is a subtask of {Y}'
  examples:
  - named entity recognition subtask_of information extraction
  - machine translation subtask_of natural language generation
  - error detection subtask_of reliable delivery
  near_misses:
  - relation: is_a
    example: BERT is_a masked language model
    why: a kind of method, not a narrower task
  - relation: part_of
    example: slow start part_of[phase] TCP congestion control
    why: a stage of one process, not a narrower task of a wider task
  - relation: has_purpose
    example: a checksum has_purpose error detection
    why: the purpose of a mechanism, not a task hierarchy between two tasks
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: true
  inverse_of: has_subtask
  conflicts_with: []
  compatible_with: {}
  external_labels:
    SciNLP:
    - subtaskOf
- name: contrasts_with
  family: comparison
  layer: semantic
  definition: Source and target are commonly compared and differ; name what differs in the dimension qualifier and
    state it in the statement. Use for confusable pairs.
  template: '{X} differs from {Y}'
  examples:
  - 'slow start contrasts_with congestion avoidance [dimension: cwnd growth rate]'
  - 'synchronous transmission contrasts_with asynchronous transmission [dimension: clock sharing]'
  near_misses: []
  domain_types:
  - Any
  range_types:
  - Any
  directional: false
  symmetric: true
  transitive: false
  inverse_of: null
  conflicts_with: []
  compatible_with: {}
  external_labels:
    SciNLP:
    - compareWith
- name: similar_to
  family: comparison
  layer: semantic
  definition: 'Source and target are alike in a stated or clearly implied respect (a shared property, role or mechanism)
    but are DIFFERENT concepts. Never a merge or an alias: two names for one thing are same_concept (a node property,
    CR-008). Use contrasts_with when the sentence stresses a difference.'
  template: '{X} is similar to {Y}'
  examples:
  - Adam similar_to RMSprop
  - bit stuffing similar_to byte stuffing
  near_misses:
  - relation: contrasts_with
    example: slow start contrasts_with congestion avoidance
    why: stresses what differs, not what is alike
  - relation: same_concept
    example: a datagram, also called a message
    why: two names for one thing; no edge, a merge candidate
  - relation: is_a
    example: Ethernet is_a link-layer technology
    why: one is a kind of the other, not two alike things
  domain_types:
  - Any
  range_types:
  - Any
  directional: false
  symmetric: true
  transitive: false
  inverse_of: null
  conflicts_with: []
  compatible_with:
    contrasts_with: partial
  external_labels:
    SciNLP:
    - similarWith
- name: prerequisite_of
  family: pedagogical
  layer: prerequisite
  definition: Understanding source is needed to understand target (educational dependency; NOT book order).
  template: understanding {X} is needed to understand {Y}
  examples:
  - sliding window prerequisite_of TCP flow control
  near_misses:
  - relation: requires
    example: CSMA/CD requires minimum frame length
    why: technical dependency, not a learning dependency
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: true
  inverse_of: null
  conflicts_with: []
  compatible_with: {}
- name: measured_by
  family: evaluation
  layer: semantic
  definition: Source (a system, method, protocol, link or other thing that has a measurable quality) is quantified
    by the metric named by target. The target is a metric or a unit of measurement, not a characteristic.
  template: '{X} is measured by {Y}'
  examples:
  - a translation system measured_by BLEU
  - a congestion control scheme measured_by goodput
  - a link measured_by bandwidth
  near_misses:
  - relation: has_property
    example: slow start has_property exponential cwnd growth
    why: a characteristic, not a metric used to measure it
  - relation: evaluated_by
    example: question answering evaluated_by exact match
    why: the source is a task assessed in benchmark practice
  - relation: increases
    example: a larger window increases throughput
    why: a quantity change, not the measuring of something
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: false
  inverse_of: measures
  conflicts_with: []
  compatible_with: {}
  external_labels:
    SciNLP:
    - MeasuredBy
- name: evaluated_by
  family: evaluation
  layer: semantic
  definition: Source (a task or problem) is assessed with the metric named by target, as in benchmark practice ("the
    task is evaluated by metric M"). Use measured_by when the source is a system, method or link whose quality the
    metric quantifies.
  template: '{X} is evaluated by {Y}'
  examples:
  - question answering evaluated_by exact match
  - routing evaluated_by convergence time
  near_misses:
  - relation: measured_by
    example: a translation system measured_by BLEU
    why: here the source is a method or system, not a task
  - relation: evaluated_on
    example: sentiment analysis evaluated_on SST-2
    why: the target is data, not a metric
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: false
  inverse_of: evaluates
  conflicts_with: []
  compatible_with:
    measured_by: partial
  external_labels:
    SciNLP:
    - evaluatedBy
- name: evaluated_on
  family: evaluation
  layer: semantic
  definition: Source (a task or method) is tested on the dataset, benchmark, workload or testbed named by target.
    The target is data or a test setting, not a metric and not a means the source employs.
  template: '{X} is evaluated on {Y}'
  examples:
  - sentiment analysis evaluated_on SST-2
  - a routing protocol evaluated_on a 100-node testbed
  near_misses:
  - relation: uses
    example: TCP uses sliding window
    why: a means employed, not data it is tested on
  - relation: evaluated_by
    example: routing evaluated_by convergence time
    why: the target is a metric, not data
  domain_types:
  - Any
  range_types:
  - Any
  directional: true
  symmetric: false
  transitive: false
  inverse_of: tests
  conflicts_with: []
  compatible_with: {}
  external_labels:
    SciNLP:
    - evaluatedOn
chain_link_types:
- name: cause
  template: '{A} because {B}'
  cues:
  - because
  - since
  - as a result
  - therefore
  - so
  - hence
  - due to
- name: purpose
  template: '{A} in order that {B}'
  cues:
  - in order to
  - so that
  - to ensure
  - to avoid
  - for
- name: condition
  template: if {B} then {A}
  cues:
  - if
  - when
  - unless
  - only if
  - as long as
  - whenever
- name: sequence
  template: '{A} then {B}'
  cues:
  - then
  - after
  - before
  - once
  - next
  - until
  - afterwards
- name: contrast
  template: '{A} whereas {B}'
  cues:
  - whereas
  - but
  - however
  - unlike
  - while
  - in contrast
minor: 4
output_fields:
  other_description:
    type: str | None
    note: 'Required when the answer is OTHER: one sentence saying what the sentence expresses.'
  other_suggested_label:
    type: str | None
    note: 'Required when the answer is OTHER: a 1–3 word verb phrase, e.g. ''connects'', ''is carried in''.'
patch: 1
