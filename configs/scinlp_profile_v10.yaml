# CR-060 profile v10 = profile v5 + the Part A head-variant identity rule (variant A-all) at assembly. CR-055 profile v4 (generator prompt v6_scinlp + concept_recall switches); was: CR-053 profile v3 (generator prompt v5_scinlp), built on the CR-047 copy of the CR-012 SciNLP benchmark-local schema profile (Research ruling 2026-10-10). Only the benchmark schema changes; the CR-009 architecture is the same.
name: scinlp
release_label: SciNLP-repo-e78342be
status: "CR-060 profile v10 = profile v5 + span identity A-all; SUPERSEDED by v11 (2026-10-30): R-acr spans lose their closing bracket under r1key matching"
entity_types:
  task: An objective requiring operational resolution through systematic processes (for example text classification, named
    entity recognition).
  method: Specific algorithms or model architectures explicitly mentioned in the paper (for example BERT, LSTM). The paper
    calls this type Model; the frozen repository's literal label is `method`.
  dataset: Structured data resources explicitly used or referenced in the research (for example Penn Treebank).
  metric: Quantitative measures used to evaluate model performance (for example F1-score, BLEU).
relation_registry: configs/relations_scinlp_v1.0.1.yaml
symmetric:
- similarWith
- compareWith
domain: natural language processing research
generator_prompt:
  task: concept_generator
  version: v6_scinlp
  base_version: v4
few_shot_bank: none (the existing prompt framework does not require examples; no test-derived or invented examples are used)
term_lexicon: empty (the networking lexicon is disabled; no SciNLP identity lexicon is created)
canonical_overrides: empty
alias_rules: configs/alias_rules.yaml (generic R1-R3 machinery retained)
pruner:
  tau: 0.0
  note: same recipe as the CR-009 final production run (pruner off outside its training domain)
strict_g_links: true
scoring:
  level: mention
  scorer: CR-012 SciNLP strict scorer
  negated_relations_are_not_positive_edges: true
  unit: document
  full_documents: true
forbidden_in_prompts:
- SciNLP test examples
- test entity surfaces
- test relations
- test-derived aliases
- test-derived few-shot examples
# CR-055: concept-recall switches read by cumap.concepts_v4.cr009_run for this profile only (the CUM / P&D path is unchanged).
concept_recall:
  form: G2                       # CR-055 arm B: an independent first reading, then the main call checks its terms
  carry_forward_rule: contained  # restore an earlier verified item unless a containing / contained span replaced it (was: any shared word)
  quote_repair: true             # F2 accepts a quote that differs from the text only in spaces around punctuation (stored quote = the text's substring)
  m6: true                       # hint acronym-like tokens and the terms below that no item covers
  m6_terms: [accuracy, precision, recall, F1, perplexity, entropy, fluency, coverage, diversity, p-value, BLEU, ROUGE, n-gram, n-grams, bigram, bigrams, trigram, trigrams]
  m6_instruction: "These terms look like concepts this paper uses that you did not list: {items}. Add each with evidence (a metric, method, dataset or task the text names), or reject it with a reason."
# CR-056: the pair budget. "all" = every candidate pair is classified (the frozen D3 rule is replaced at call time by cumap.cr056.scinlp_run).
pair_budget: all
# CR-060 Part A: head-variant identity applied after relation classification (cumap.cr060.span_identity); the pre-step checkpoint is kept.
span_identity: A-all
