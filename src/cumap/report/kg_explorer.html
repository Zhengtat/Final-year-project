<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge graph explorer</title>
<style>
:root{
  --bg:#f6f6f3;--panel:#fff;--ink:#15171c;--ink2:#5a6070;--line:#dcdde2;--accent:#0072B2;--accent-ink:#fff;
  --warn:#8a3b00;--warnbg:#fff1e3;--okbg:#e8f3fa;--chip:#eef0f4;--code:#f1f2f5;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-io:cubic-bezier(0.77,0,0.175,1);
}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--panel:#1b1e24;--ink:#eceef2;--ink2:#a3aab8;--line:#31353d;--accent:#56B4E9;--accent-ink:#0b1117;--warn:#ffb27a;--warnbg:#33261a;--okbg:#17262f;--chip:#262a32;--code:#23262d}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
.small select,.small input,.whyform select,.whyform input{color:var(--ink)}
select.tsec{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 8px;max-width:100%}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 11px;transition:transform 140ms var(--ease-out),background-color 140ms var(--ease-out),border-color 140ms var(--ease-out)}
button:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){button:hover{border-color:var(--accent)}}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
code{background:var(--code);padding:0 4px;border-radius:4px;font-size:12px;word-break:break-all}
header{padding:10px 16px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.005em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 13px}
.seg button+button{border-left:1px solid var(--line)}
.sp{flex:1}
.banner{margin-top:8px;padding:8px 13px;border-radius:6px;font-size:13.5px;border:0;border-left:4px solid var(--accent);background:var(--okbg)}
.banner.warn{background:var(--warnbg);color:var(--ink);border-left-color:var(--warn)}
.banner.ok{background:var(--okbg)}
.banner details{margin-top:4px}.banner summary{font-size:12.5px}
.tier{display:inline-block;font-size:10px;letter-spacing:.05em;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle;font-weight:500}
.lede{max-width:820px;color:var(--ink2);font-size:13.5px;margin:2px 0 10px}
.mdesc{font-size:12.5px;color:var(--ink);margin:2px 0 6px;max-width:240px}
.banner b{font-weight:600}
main{flex:1;display:flex;min-height:0}
#side{width:316px;padding:16px;overflow:auto;border-right:1px solid var(--line);background:var(--panel);flex:none}
#side h3{font-size:12.5px;color:var(--ink);margin:20px 0 6px;font-weight:600}
#side h3:first-child{margin-top:0}
#side label{display:flex;align-items:center;gap:7px;margin:2px 0;font-size:13px}
#side input[type=search],#side select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.rl{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:3px 7px}
.small{font-size:12px;color:var(--ink2)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);margin-bottom:10px}
.card .close{float:right;border:0;background:none;padding:0 4px;font-size:16px;color:var(--ink2)}
.card h4{margin:0 0 6px;font-size:13.5px}
.card ul{margin:4px 0 0 16px;padding:0}
.tour{display:flex;flex-direction:column;gap:6px}
.tour button{text-align:left;padding:7px 10px}
.tour button small{display:block;color:var(--ink2);font-size:11px}
.big{display:flex;gap:14px;margin:4px 0}
.big div{font-size:11px;color:var(--ink2)}
.big b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0;background:var(--chip)}
.bar span{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--ink2)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
#stage{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.tabs button{border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;background:none;padding:7px 16px;color:var(--ink2)}
.tabs button.on{background:var(--bg);border-color:var(--line);color:var(--ink)}
.pane{flex:1;min-height:0;position:relative;display:none}
.pane.on{display:block}
canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#status{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--ink2);background:var(--panel);padding:2px 9px;border-radius:6px;border:1px solid var(--line)}
#hint{position:absolute;right:10px;top:8px;font-size:11px;color:var(--ink2)}
.scroll{position:absolute;inset:0;overflow:auto;padding:18px 24px;background:var(--bg)}
#detail{width:390px;padding:16px 18px;overflow:auto;border-left:1px solid var(--line);background:var(--panel);flex:none;font-size:13.5px}
#detail .in{transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}
#detail .in.pre{opacity:0;transform:translateY(6px)}
#detail h2{font-size:16px;margin:0 0 8px;font-weight:600;line-height:1.3}
#detail dt{font-size:12px;font-weight:600;color:var(--ink2);margin-top:14px}
#detail dd{margin:2px 0 0}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);font-size:12px;margin:1px 2px 1px 0}
.na{color:var(--ink2);font-style:italic}
.sent{border-left:3px solid var(--accent);padding:4px 10px;background:var(--bg);border-radius:0 6px 6px 0;line-height:1.55}
.sent mark{padding:0 2px;border-radius:3px}
.sent mark.a{background:#cde6f5;color:#06324c}
.sent mark.b{background:#ffe2bf;color:#5a2c00}
.sent u{text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:2px}
@media (prefers-color-scheme:dark){.sent mark.a{background:#1d4a66;color:#d7ecfa}.sent mark.b{background:#6b3d08;color:#ffe9cf}}
details{margin-top:10px}
summary{cursor:pointer;color:var(--ink2);font-size:12px}
pre.json{background:var(--code);padding:8px;border-radius:7px;overflow:auto;font-size:11px;max-height:260px}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:none}
@media (hover:hover) and (pointer:fine){a.lnk:hover{text-decoration:underline}}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
table.t th{position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
table.t tr[data-id]{cursor:pointer}
@media (hover:hover) and (pointer:fine){table.t tr[data-id]:hover{background:var(--okbg)}}
table.t tr.sel{background:var(--okbg)}
.docs{border-collapse:collapse;font-size:12px;width:100%;margin:4px 0}
.docs th,.docs td{border:1px solid var(--line);padding:3px 6px;text-align:left}
.docs tr[data-d]{cursor:pointer}
.docs tr.sel{background:var(--okbg)}
.doc{line-height:2;font-size:14px;max-width:900px}
.doc s{display:inline;text-decoration:none;padding:1px 2px;border-radius:3px;cursor:pointer}
.doc .pg{background:#cde6f5}.doc .pf{background:#ffd9b8}.doc .gm{outline:2px dashed #888;outline-offset:1px}
@media (prefers-color-scheme:dark){.doc .pg{background:#1d4a66}.doc .pf{background:#6b3d08}}
.sentbreak{display:block;height:6px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stag>*{animation:rise 260ms var(--ease-out) both}
.stag>*:nth-child(2){animation-delay:40ms}.stag>*:nth-child(3){animation-delay:80ms}.stag>*:nth-child(4){animation-delay:120ms}.stag>*:nth-child(5){animation-delay:160ms}
body.debug .stag>*{animation:none}
body.debug #detail .in{transition:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-property:opacity!important;transition-duration:120ms!important}#detail .in.pre{transform:none}}
@media (max-width:980px){html,body{height:auto}body{min-height:100vh}main{flex-direction:column;min-height:0}#stage{order:1;min-height:80vh}#side{order:2;width:auto;max-height:none;border-right:0;border-top:1px solid var(--line)}#detail{order:3;width:auto;max-height:none;border-left:0;border-top:1px solid var(--line)}.tabs{overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}}
.reviewonly{display:block}.debugonly{display:none}
body.debug .reviewonly{display:none}body.debug .debugonly{display:block}

/* ---- CR-013 trace layer */
.vh{font-size:18px;margin:0 0 6px;font-weight:600}
.ribbon{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;margin:10px 0}
.ribbon button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 10px;width:100%}
.ribbon button .n{font-size:10px;color:var(--ink2)}
.ribbon button small{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ribbon button.on{background:var(--accent);color:var(--accent-ink)}
.ribbon button.on small,.ribbon button.on .n{color:var(--accent-ink);opacity:1}
.funnel{margin:6px 0 12px}.fr{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0}
.fl{width:130px;color:var(--ink2)}.fb{flex:1;height:10px;background:var(--chip);border-radius:5px;overflow:hidden}.fb i{display:block;height:100%;background:var(--accent)}.fv{width:56px;text-align:right;font-variant-numeric:tabular-nums}
.card.warn{border-color:var(--warn);background:var(--warnbg);color:var(--warn)}
.evc{border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin:6px 0;background:var(--panel);font-size:13px}
.evh{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.auth-RULE{background:#dfe9f5;color:#12365f}.auth-MODEL{background:#f5e3d6;color:#6b3410}.auth-SCORE{background:#e7e0f5;color:#32215e}.auth-STRUCTURAL{background:#e1efe6;color:#17452a}.auth-HUMAN{background:#f3e8c2;color:#5a4400}.auth-UNKNOWN{background:#eee;color:#444}
.layer-REPLAYED{background:#fff1e3;color:var(--warn);border:1px solid var(--warn)}.layer-JOINED{background:#e8f3fa;color:#0b4a73;border:1px solid #9cc4de}
@media (prefers-color-scheme:dark){.auth-RULE{background:#1c3350;color:#cfe3fa}.auth-MODEL{background:#4a2d17;color:#f6dcc7}.auth-SCORE{background:#33284f;color:#ddd3f5}.auth-STRUCTURAL{background:#1b3a28;color:#cdeedb}.auth-HUMAN{background:#4a3e12;color:#f3e8c2}.auth-UNKNOWN{background:#333;color:#ddd}.layer-JOINED{background:#17303f;color:#bfe0f5;border-color:#3c6a89}.layer-REPLAYED{background:var(--warnbg);color:var(--warn)}}
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.stepper button{font-size:12px;padding:4px 9px}.stepper button.on{background:var(--accent);color:var(--accent-ink)}
.nav{margin:8px 0}.stepbody{min-height:140px}
.srcbox{line-height:1.7;max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--bg)}
.srcbox mark.a{background:#cde6f5;color:#06324c;padding:0 1px;border-radius:2px}
@media (prefers-color-scheme:dark){.srcbox mark.a{background:#1d4a66;color:#d7ecfa}}
.boundary div{padding:2px 6px;border-left:3px solid var(--line);margin:2px 0;font-size:12px}.boundary .in{border-left-color:#009E73}.boundary .out{border-left-color:#D55E00}.rk{font-variant-numeric:tabular-nums;color:var(--ink2)}
.whyform{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:8px 0}.whyform input,.whyform select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);min-width:200px}
.checks{margin:6px 0 8px 18px;padding:0}.checks li{margin:2px 0}.ans{display:inline-block;min-width:92px;font-weight:600;font-size:12px}
.ck-yes .ans,.ck-relation_proposed .ans{color:#007a5a}.ck-no .ans,.ck-no_relation .ans{color:#C23B3B}.ck-unknown .ans,.ck-not_assessed_in_production .ans{color:var(--ink2)}
.fail{border-left:4px solid #C23B3B;padding:6px 10px;background:var(--bg);border-radius:0 6px 6px 0}.okk{border-left:4px solid #009E73;padding:6px 10px;background:var(--bg);border-radius:0 6px 6px 0}
canvas.mini{width:100%;display:block;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.snapctl{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}
.jst{margin:8px 0;padding-top:6px;border-top:1px solid var(--line)}.jh{font-size:13px;margin:16px 0 4px}

/* ---- CR-013 STOP 4: evaluation overlay (visually distinct, opt-in) */
.evbtn{border-color:var(--warn)!important;color:var(--warn)}
.evbtn.on{background:var(--warn)!important;color:var(--bg)!important}
.evmatrix td.evcell{cursor:pointer;font-variant-numeric:tabular-nums;text-align:center;min-width:44px}
.evmatrix td.evzero{text-align:center;color:var(--ink2)}
.evmatrix th{text-align:center}
@media (hover:hover) and (pointer:fine){.evmatrix td.evcell:hover{outline:2px solid var(--warn)}}
button.evchip{font-size:12px;padding:3px 9px;border-radius:12px}button.evchip.on{background:var(--warn);color:var(--bg);border-color:var(--warn)}
.checks li.evbad{background:var(--warnbg);border-radius:5px;padding:1px 4px}.checks li.evafter{color:var(--ink2)}
</style>
</head>
<body class="review">
<header>
  <div class="top">
    <h1>Knowledge graph explorer</h1>
    <div class="seg" id="modeseg"><button id="m-pd" title="The knowledge graph built from the P&amp;D networking textbook">P&amp;D dataset</button><button id="m-sci" title="A test run on scientific papers, to see how the system does outside networking">SciNLP dataset</button><button id="m-ev" class="evbtn" title="Compare the system's output with human-made answer keys (test results only)">How well it scores</button></div>
    <div class="sp"></div>
    <div class="seg" id="viewseg" title="Simple: the essentials, with guidance. Detailed: every field, tables and ids."><button id="v-review">Simple</button><button id="v-debug">Detailed</button></div>
  </div>
  <div id="banner"></div>
</header>
<main>
  <aside id="side" tabindex="0" aria-label="Filters and guides"></aside>
  <div id="stage">
    <div class="tabs" id="tabs"></div>
    <div class="pane on" id="p-graph"><canvas id="cv"></canvas><div id="status"></div><div id="hint"></div></div>
    <div class="pane" id="p-doc"><div class="scroll" id="docview" tabindex="0" role="region" aria-label="Document"></div></div>
    <div class="pane" id="p-table"><div class="scroll" id="tableview" tabindex="0" role="region" aria-label="Tables"></div></div>
    <div class="pane" id="p-pipeline"><div class="scroll" id="v-pipeline" tabindex="0" role="region" aria-label="Pipeline"></div></div>
    <div class="pane" id="p-section"><div class="scroll" id="v-section" tabindex="0" role="region" aria-label="Explain a section"></div></div>
    <div class="pane" id="p-why"><div class="scroll" id="v-why" tabindex="0" role="region" aria-label="Why not?"></div></div>
    <div class="pane" id="p-lost"><div class="scroll" id="v-lost" tabindex="0" role="region" aria-label="Rejected and lost items"></div></div>
    <div class="pane" id="p-snap"><div class="scroll" id="v-snap" tabindex="0" role="region" aria-label="Stage snapshots"></div></div>
    <div class="pane" id="p-trace"><div class="scroll" id="v-trace" tabindex="0" role="region" aria-label="Trace table"></div></div>
    <div class="pane" id="p-evscore"><div class="scroll" id="v-evscore" tabindex="0" role="region" aria-label="CR-017 scorecard"></div></div>
    <div class="pane" id="p-evmap"><div class="scroll" id="v-evmap" tabindex="0" role="region" aria-label="Evaluation failure map"></div></div>
    <div class="pane" id="p-evlist"><div class="scroll" id="v-evlist" tabindex="0" role="region" aria-label="Evaluation gold relations"></div></div>
  </div>
  <aside id="detail" tabindex="0" aria-label="Details of the selected item"><div class="in" id="detailin"></div></aside>
</main>
<script type="application/octet-stream" id="trace-gz">/*__TRACE_B64__*/</script>
<!--__TRACE_ALT__-->
<script type="application/octet-stream" id="eval-gz">/*__EVAL_B64__*/</script>
<script type="application/octet-stream" id="scorecard-gz">/*__SCORECARD_B64__*/</script>
<script>
const DATA = /*__DATA__*/null;
const NA = DATA.na;
// 2026-10-16 rebuild (comparison only): alternative P&D graph(s) and the rebuilt SciNLP run, switchable; the defaults are unchanged
DATA.pd_sets = Object.assign({[DATA.pd.run_id]: DATA.pd}, DATA.pd_alt||{});
DATA.sci_sets = Object.assign({frozen: DATA.sci}, DATA.sci_alt||{});
const PROD_RUN = DATA.pd.run_id;
let TRACE_ID = 'trace-gz';
function usePdRun(k){ if(!DATA.pd_sets[k]) return; DATA.pd=DATA.pd_sets[k]; TRACE_ID = k===PROD_RUN ? 'trace-gz' : 'trace-gz-'+k; TR=null; TRLOAD=null; S.sel=null; setMode('pd'); }
function useSciRun(k){ if(!DATA.sci_sets[k]) return; const id=S.doc&&S.doc.doc_id; DATA.sci=DATA.sci_sets[k]; S.sel=null; setMode('sci', DATA.sci.docs.find(d=>d.doc_id===id)||DATA.sci.docs[0]); }
function runSwitch(){
  if(S.mode==='pd'&&Object.keys(DATA.pd_sets).length>1) return '<h3>Graph</h3><div class="seg" style="display:flex">'+Object.keys(DATA.pd_sets).map(k=>'<button data-pdrun="'+esc(k)+'" class="'+(DATA.pd.run_id===k?'on':'')+'" style="flex:1">'+esc(k)+(k===PROD_RUN?' · production':' · rebuild')+'</button>').join('')+'</div>';
  if(S.mode==='sci'&&Object.keys(DATA.sci_sets).length>1) return '<h3>Run</h3><div class="seg" style="display:flex">'+Object.keys(DATA.sci_sets).map(k=>'<button data-scirun="'+esc(k)+'" class="'+(DATA.sci===DATA.sci_sets[k]?'on':'')+'" style="flex:1">'+(k==='frozen'?'Frozen (CR-012)':'Rebuilt 2026-10-16')+'</button>').join('')+'</div>';
  return '';
}
// Okabe-Ito based palette (colour-blind safe)
const PAL = ['#0072B2','#E69F00','#009E73','#CC79A7','#D55E00','#56B4E9','#B8A400','#7A7A7A','#8C4FD8','#C23B3B','#2E8B8B','#A0522D','#5B6EE1','#4F7F2F'];
const TYPE_IDX = {Concept:7,Protocol:0,Component:1,Mechanism:3,DataUnit:2,Parameter:4,Property:5,Event:9,State:6,Layer:12,Identifier:8,task:0,method:1,dataset:2,metric:3};
const RING_COL = {centre:'#C23B3B',inner:'#D55E00',middle:'#E69F00',outer:'#56B4E9',unlinked:'#B5B9C2'};
const CODE_LABEL = {N0:'one of the two concepts was never found',N1:'a concept was found, but with the wrong words',P0:'the two concepts were never checked as a pair',R0:'checked, but the model said "no relation"',R1:'wrong kind of relation',R2:'right relation, wrong direction',R3:'wrong type or condition',E0:'the quoted evidence failed the check',C0:'one concept was split in two',C1:'two different concepts were merged',NODE_LEVEL_ONLY:'only the concepts matched, not the exact words'};
const CI_PLAIN = {NOT_EVALUABLE_SMALL_N:'Too few test documents or sections to give a reliable range.',DESCRIPTIVE_SMALL_N:'The range is rough: it rests on only a few sections.'};
const ciPlain = s => '<span title="'+esc(s)+'">'+esc(CI_PLAIN[s]||s)+'</span>';
const CODE_COL = {N0:'#C23B3B',N1:'#D55E00',P0:'#E69F00',R0:'#56B4E9',R1:'#0072B2',R2:'#8C4FD8',R3:'#7A7A7A',E0:'#7A7A7A'};
const REDUCED = typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion:reduce)').matches;
const DARK = () => typeof matchMedia==='function' && matchMedia('(prefers-color-scheme:dark)').matches;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = v => (v===null||v===undefined||v===NA||(Array.isArray(v)&&!v.length)) ? (S.view==='debug'?'<span class="na">'+NA+'</span>':'<span class="na" title="'+NA+'">not saved by this run</span>') : (typeof v==='object' ? '<code>'+esc(JSON.stringify(v))+'</code>' : esc(v));
const relCache = {}; const relCol = r => (r in relCache) ? relCache[r] : (relCache[r]=PAL[Object.keys(relCache).length%PAL.length]);
const typeCol = t => PAL[(t in TYPE_IDX)?TYPE_IDX[t]:7];
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const cv = $('cv'), ctx = cv.getContext('2d');
const S = {mode:'pd', view:'review', doc:null, G:null, tab:'graph', sel:null, hover:null, kb:false,
  F:{types:new Set(),rels:new Set(),chapter:3,labels:false,unlinked:false,layout:'force',colour:'type',query:'',missed:false,ghostOnly:false,top:0}};
let view = {x:0,y:0,k:1}, byId = {}, adj = {}, fade = 0, fadeT = 0, anim = null;
const animOK = () => S.view==='review' && !REDUCED && !S.kb;

function pos(n){ return (S.mode==='pd'&&S.F.layout==='rings') ? [n.rx,n.ry] : [n.fx,n.fy]; }
function defs(){ return S.mode==='pd' ? DATA.pd.defs : DATA.sci.defs; }

// ---------------------------------------------------------------- state / url
function hashWrite(){
  const p = ['m='+S.mode,'v='+S.view]; if(S.mode==='sci') p.push('d='+encodeURIComponent(S.doc.doc_id)); if(S.mode==='pd') p.push('ch='+S.F.chapter);
  if(S.sel) p.push('s='+(S.sel.kind==='node'?'n:':'e:')+encodeURIComponent(S.sel.kind==='node'?S.sel.id:S.sel.e.id));
  try{ history.replaceState(null,'','#'+p.join('&')); }catch(e){}
}
function hashRead(){
  const o={}; (location.hash||'').replace(/^#/,'').split('&').forEach(kv=>{const i=kv.indexOf('='); if(i>0) o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));}); return o;
}

function setMode(m, d, keepSel){
  if(m==='ev'){ evEnter(); return; }
  S.mode=m; S.tab='graph';
  if(m==='pd'){ S.G=DATA.pd; S.doc=null; S.F.chapter=3; S.F.unlinked=false; S.F.layout='force'; S.F.colour='type'; S.F.missed=false; }
  else { S.doc=d||S.doc||DATA.sci.docs[0]; S.G=S.doc; S.F.colour='gold'; S.F.missed=(S.view==='debug'); }
  S.F.types=new Set(S.G.nodes.filter(n=>!n.ghost).map(n=>n.type)); S.F.rels=new Set(S.G.edges.map(e=>e.rel)); S.F.query='';
  byId={}; adj={}; S.G.nodes.forEach(n=>{byId[n.id]=n;adj[n.id]=[];}); S.G.edges.forEach(e=>{adj[e.s].push(e); adj[e.t].push(e);});
  if(!keepSel) S.sel=null;
  chrome(); banner(); side(); tabs(); showTab('graph'); fit(false); renderDetail(true); draw(); hashWrite();
}
function setView(v){
  S.view=v; document.body.className=v; store.set('kg_view',v);
  $('v-review').classList.toggle('on',v==='review'); $('v-debug').classList.toggle('on',v==='debug');
  if(S.mode==='ev'){ evSide(); tabs(); showTab(S.tab); renderDetail(true); hashWrite(); return; }
  if(S.mode==='sci') S.F.missed=(v==='debug');
  side(); tabs(); showTab((S.tab==='table'||S.tab==='trace')&&v==='review'?'graph':S.tab); renderDetail(true); draw(); hashWrite();
}
function chrome(){ $('m-ev').classList.toggle('on',S.mode==='ev'); $('m-pd').classList.toggle('on',S.mode==='pd'); $('m-sci').classList.toggle('on',S.mode==='sci'); $('v-review').classList.toggle('on',S.view==='review'); $('v-debug').classList.toggle('on',S.view==='debug'); }

function banner(){
  if(S.mode==='ev'){ evBanner(); return; }
  const b=$('banner');
  if(S.mode==='pd'){
    const alt = DATA.pd.run_id!==PROD_RUN;
    b.innerHTML='<div class="banner'+(alt?' warn':' ok')+'"><b>P&amp;D dataset'+(alt?' · rebuild '+esc(DATA.pd.run_id)+' (comparison only; the production graph is '+esc(PROD_RUN)+')':'')+'</b> — the ideas in the networking textbook <i>Computer Networks: A Systems Approach</i> (Peterson &amp; Davie), chapters 1–3, and how they connect. Every link comes with the sentence from the book that supports it.'+
    '<details><summary>About this graph</summary>Built by run <code>'+esc(DATA.pd.run_id)+'</code> (chapters 1–3 are the development set). When the same system was tested on other P&amp;D sections ('+DATA.pd_heldout.sections.join(', ')+'), its Strict E2E Edge F1 (from 0 to 1) was <b>'+DATA.pd_heldout.e0_strict_f1.toFixed(3)+'</b>. That score belongs to those test sections, not to the graph shown here.</details></div>';
  } else {
    const h=DATA.sci.headline;
    const reb = DATA.sci!==DATA.sci_sets.frozen;
    b.innerHTML='<div class="banner warn"><b>SciNLP dataset — a test run, not the main graph.'+(reb?' Rebuilt 2026-10-16 with spelling-variant matching and the rejected-link adjudicator; the frozen CR-012 scores are not replaced.':'')+'</b> The same system was run on 3 scientific papers to see how well it works outside networking. Its output is compared with a human answer key and is not part of the P&amp;D graph.'+
    '<details><summary>Overall score</summary>'+(DATA.sci.cr019?'Strict E2E Edge F1 (CR-019 scoring, every predicted relation counted) <b>'+DATA.sci.cr019.f1.toFixed(3)+'</b> · precision '+DATA.sci.cr019.precision.toFixed(3)+' · recall '+DATA.sci.cr019.recall.toFixed(3)+', over all 3 papers. ':'')+ciPlain(h.ci_status)+'<br><span class="small">Frozen CR-012 scorer: Strict E2E Edge F1 '+h.relation_f1.toFixed(3)+' (precision '+h.precision.toFixed(3)+', recall '+h.recall.toFixed(3)+'); it leaves most predicted relations unscored.</span></details></div>';
  }
}

// ---------------------------------------------------------------- filtering / drawing
function visible(){
  const G=S.G, F=S.F, ok=new Set(), nodes=[];
  G.nodes.forEach(n=>{
    if(n.ghost){ if(!F.missed) return; }
    else if(!F.types.has(n.type)) return;
    if(S.mode==='pd'){ if(n.ch>F.chapter) return; if(!n.linked&&!F.unlinked) return; }
    if(F.top&&S.mode==='pd'&&(n.importance==null||n.importance<F.top)) return;
    nodes.push(n); ok.add(n.id);
  });
  const edges=G.edges.filter(e=>(e.kind!=='gold_missed'||F.missed)&&F.rels.has(e.rel)&&ok.has(e.s)&&ok.has(e.t)&&(S.mode!=='pd'||e.ch<=F.chapter));
  return {nodes,edges,ok};
}
function nodeColour(n){
  if(n.ghost) return '#9aa0ab';
  if(S.mode==='pd'&&S.F.colour==='ring') return RING_COL[n.ring]||'#B5B9C2';
  if(S.mode==='sci'&&S.F.colour==='gold') return n.gold_entity_match?'#0072B2':'#D55E00';
  return typeCol(n.type);
}
function nodeR(n){ const z=Math.min(Math.max(view.k/90,.6),1.4); if(S.mode==='pd') return (S.F.colour==='ring'&&n.importance!=null?2+5*n.importance:2.4+Math.min(2.6,n.n_mentions*.12))*z; return (4+Math.min(4,n.n_spans*.5))*z; }
const sx=p=>p[0]*view.k+view.x, sy=p=>p[1]*view.k+view.y;
function resize(){ const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1; cv.width=r.width*d; cv.height=r.height*d; ctx.setTransform(d,0,0,d,0,0); }
function targetView(nodes){
  const r=cv.getBoundingClientRect(); if(!nodes.length) return {x:r.width/2,y:r.height/2,k:1};
  let a=1e9,b=1e9,c=-1e9,d=-1e9; nodes.forEach(n=>{const p=pos(n);a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);});
  const k=Math.min((r.width-80)/Math.max(c-a,1e-6),(r.height-80)/Math.max(d-b,1e-6),nodes.length<4?260:1e9);
  return {k,x:r.width/2-k*(a+c)/2,y:r.height/2-k*(b+d)/2};
}
function moveView(t, ms){
  if(anim) cancelAnimationFrame(anim.id);
  if(!ms||!animOK()){ view=t; draw(); return; }
  const f=Object.assign({},view), t0=performance.now();
  const ease=u=>u<.5?8*u**4:1-8*(1-u)**4; // strong ease-in-out for on-screen movement
  const step=now=>{ const u=Math.min(1,(now-t0)/ms), e=ease(u); view={x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,k:f.k*Math.pow(t.k/f.k,e)}; draw(); if(u<1) anim.id=requestAnimationFrame(step); };
  anim={id:requestAnimationFrame(step)};
}
function fit(animate){ resize(); moveView(targetView(visible().nodes), animate?280:0); }
function focusSet(){
  const f=new Set(); if(!S.sel) return f;
  if(S.sel.kind==='node'){ f.add(S.sel.id); (adj[S.sel.id]||[]).forEach(e=>{f.add(e.s);f.add(e.t);}); } else { f.add(S.sel.e.s); f.add(S.sel.e.t); }
  return f;
}
function arrow(x1,y1,x2,y2,r2,col,w,dash){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy); if(L<1) return; const ux=dx/L,uy=dy/L,ex=x2-ux*(r2+1),ey=y2-uy*(r2+1);
  ctx.setLineDash(dash||[]); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(ex,ey); ctx.stroke(); ctx.setLineDash([]);
  const s=5+w*1.2; ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex-ux*s-uy*s*.5,ey-uy*s+ux*s*.5); ctx.lineTo(ex-ux*s+uy*s*.5,ey-uy*s-ux*s*.5); ctx.closePath(); ctx.fill();
}
let raf=0;
function draw(){ if(raf) return; raf=requestAnimationFrame(paint); }
function paint(){
  raf=0;
  if(S.mode==='ev') return;
  const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height);
  const v=visible(), q=S.F.query.trim().toLowerCase(), dark=DARK(), focus=focusSet(), ink=dark?'#e8e8ea':'#15171c';
  // dim non-focused elements: eased over ~150ms in the review view, immediate in debug / keyboard / reduced motion
  const want=S.sel?1:0; if(animOK()){ const dt=Math.min(40,performance.now()-fadeT); fadeT=performance.now(); fade+= (want-fade)*Math.min(1,dt/60); if(Math.abs(want-fade)>.01) draw(); else fade=want; } else fade=want;
  const dimA = 1-.85*fade;
  v.edges.forEach(e=>{
    const a=byId[e.s],b=byId[e.t]; if(a===b) return; const pa=pos(a),pb=pos(b);
    const on=S.sel&&((S.sel.kind==='edge'&&S.sel.e===e)||(S.sel.kind==='node'&&(e.s===S.sel.id||e.t===S.sel.id)));
    let col=relCol(e.rel), w=1.2, dash=null;
    if(e.kind==='gold_missed'){ col='#8b919d'; dash=[5,4]; }
    else if(S.mode==='sci'&&S.F.colour==='gold'){ col=e.matches_gold?'#0072B2':'#D55E00'; w=e.matches_gold?2.6:1.2; }
    ctx.globalAlpha= on?1:(S.sel?dimA:.78); arrow(sx(pa),sy(pa),sx(pb),sy(pb),nodeR(b)*.6+3,col,on?2.8:w,dash);
    if(S.F.labels||on){ ctx.globalAlpha=1; ctx.fillStyle=ink; ctx.font='10px sans-serif'; ctx.fillText(e.rel,(sx(pa)+sx(pb))/2+3,(sy(pa)+sy(pb))/2-3); }
  });
  const labels=[];
  const top=[...v.nodes].filter(n=>S.mode==='pd'&&n.importance!=null).sort((a,b)=>b.importance-a.importance).slice(0,S.view==='review'?18:0); const topSet=new Set(top.map(n=>n.id));
  v.nodes.forEach(n=>{
    const p=pos(n),x=sx(p),y=sy(p),rr=nodeR(n);
    const hit=q&&(n.name.toLowerCase().includes(q)||(n.aliases||[]).some(a=>a.toLowerCase().includes(q)));
    ctx.globalAlpha= focus.has(n.id)||!S.sel?1:dimA;
    if(n.ghost){ ctx.strokeStyle='#8b919d'; ctx.setLineDash([3,3]); ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(x,y,rr,0,6.283); ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.fillStyle=nodeColour(n); ctx.beginPath(); ctx.arc(x,y,rr,0,6.283); ctx.fill(); }
    const isSel=S.sel&&S.sel.kind==='node'&&S.sel.id===n.id;
    if(hit||isSel){ ctx.strokeStyle=dark?'#fff':'#15171c'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(x,y,rr+3,0,6.283); ctx.stroke(); }
    if(S.F.labels||hit||(S.sel&&focus.has(n.id))||S.hover===n||topSet.has(n.id)&&view.k>0){ labels.push({n,x,y,rr,isSel,prio:isSel?0:(hit||S.hover===n)?1:(S.sel&&focus.has(n.id))?2:topSet.has(n.id)?3:4,w:n.importance!=null?n.importance:(n.n_mentions||n.n_spans||0)/100}); }
  });
  // label placement: purely visual. Selected / searched / hovered labels are always drawn; the others are drawn greedily by priority and skipped when they would overlap one already placed
  { const placed=[]; ctx.globalAlpha=1; ctx.fillStyle=ink;
    labels.sort((a,b)=>a.prio-b.prio||b.w-a.w).forEach(L=>{ ctx.font=(L.isSel?'600 ':'')+'11px sans-serif'; const w=ctx.measureText(L.n.name).width, bx=L.x+L.rr+4, box=[bx-1,L.y-9,bx+w+1,L.y+4];
      if(L.prio>1&&placed.some(b=>box[0]<b[2]&&box[2]>b[0]&&box[1]<b[3]&&box[3]>b[1])) return; placed.push(box); ctx.fillText(L.n.name,bx,L.y+4); }); }
  ctx.globalAlpha=1;
  $('status').textContent=v.nodes.filter(n=>!n.ghost).length+' concepts · '+v.edges.filter(e=>e.kind!=='gold_missed').length+' relations'+(S.F.missed?' · '+v.edges.filter(e=>e.kind==='gold_missed').length+' missed':'')+(S.mode==='pd'&&!S.F.unlinked?' · concepts with no relations hidden':'');
  $('hint').textContent=S.view==='debug'?'/ search · ← → step through neighbours · Esc clear':'drag to move · scroll to zoom · click a dot or a line';
}
function nodeAt(mx,my){ const v=visible(); let best=null,bd=1e9; v.nodes.forEach(n=>{const p=pos(n),d=Math.hypot(sx(p)-mx,sy(p)-my),rr=Math.max(nodeR(n),6); if(d<rr+2&&d<bd){bd=d;best=n;}}); return best; }
function edgeAt(mx,my){ const v=visible(); let best=null,bd=6; v.edges.forEach(e=>{const a=pos(byId[e.s]),b=pos(byId[e.t]);const x1=sx(a),y1=sy(a),x2=sx(b),y2=sy(b),L2=(x2-x1)**2+(y2-y1)**2||1;let t=((mx-x1)*(x2-x1)+(my-y1)*(y2-y1))/L2;t=Math.max(0,Math.min(1,t));const d=Math.hypot(mx-(x1+t*(x2-x1)),my-(y1+t*(y2-y1)));if(d<bd){bd=d;best=e;}}); return best; }

// ---------------------------------------------------------------- evidence sentence with highlighted endpoints
function terms(n){ return [n.canonical_name&&n.canonical_name!==NA?n.canonical_name:null,n.name,...(n.aliases||[]),...(n.surfaces||[])].filter(Boolean).map(s=>s.toLowerCase()).sort((a,b)=>b.length-a.length); }
function highlight(sentence, quote, srcN, tgtN){
  if(!sentence||sentence===NA) return '<span class="na">'+NA+'</span>';
  const low=sentence.toLowerCase(), fl=new Array(sentence.length).fill(0);
  if(quote&&quote!==NA){ const i=low.indexOf(quote.toLowerCase()); if(i>=0) for(let k=i;k<i+quote.length;k++) fl[k]|=4; }
  [[srcN,1],[tgtN,2]].forEach(([n,bit])=>{ for(const t of terms(n)){ if(t.length<2) continue; let i=low.indexOf(t); while(i>=0){ const okL=i===0||!/\w/.test(low[i-1]), okR=i+t.length>=low.length||!/\w/.test(low[i+t.length]); if(okL&&okR){ let free=true; for(let k=i;k<i+t.length;k++) if(fl[k]&3) free=false; if(free) for(let k=i;k<i+t.length;k++) fl[k]|=bit; } i=low.indexOf(t,i+t.length); } } });
  let out='',i=0; while(i<sentence.length){ let j=i; while(j<sentence.length&&fl[j]===fl[i]) j++; let seg=esc(sentence.slice(i,j)); const f=fl[i]; if(f&4) seg='<u>'+seg+'</u>'; if(f&1) seg='<mark class="a">'+seg+'</mark>'; else if(f&2) seg='<mark class="b">'+seg+'</mark>'; out+=seg; i=j; }
  return out;
}
function fillTemplate(e,a,b){ const d=defs()[e.rel]; if(!d||!d.template||d.template===NA) return null; return d.template.replace('{X}','<b>'+esc(a.name)+'</b>').replace('{Y}','<b>'+esc(b.name)+'</b>'); }

// ---------------------------------------------------------------- detail panel
function copyBtn(t){ return ' <a class="lnk" data-copy="'+esc(t)+'">copy</a>'; }
function renderDetail(instant){
  const box=$('detailin'), dbg=S.view==='debug';
  if(S.mode==='ev'){ box.className='in'; box.innerHTML=evDetailHTML(); wireEvDetail(box); return; }
  let h='';
  if(!S.sel){
    h = '<p class="na">Click a dot or a line to see what it is, where it came from, and the sentence that supports it.</p>';
    if(S.view==='review') h+='<div class="card"><h4>How to read the map</h4><ul><li>Each <b>dot</b> is a <b>concept</b>: an idea from the text, such as “router” or “bandwidth”. Its colour shows what kind of concept it is.</li><li>Each <b>arrow</b> is a <b>relation</b>: how two concepts are connected, read from the first concept to the second.</li><li>Every relation keeps the exact sentence it was taken from, so you can check it.</li></ul></div>';
  } else if(S.sel.kind==='node') h=detNode(byId[S.sel.id],dbg); else h=detEdge(S.sel.e,dbg);
  const swap=()=>{ box.innerHTML=h; wireDetail(box); };
  if(instant||!animOK()){ box.className='in'; swap(); return; }
  box.className='in pre'; swap(); requestAnimationFrame(()=>requestAnimationFrame(()=>{box.className='in';}));
}
function wireDetail(box){
  box.querySelectorAll('a[data-e]').forEach(a=>a.onclick=()=>{const e=S.G.edges.find(x=>x.id===a.dataset.e); if(e) selectEdge(e);});
  box.querySelectorAll('a[data-n]').forEach(a=>a.onclick=()=>selectNode(a.dataset.n));
  box.querySelectorAll('a[data-copy]').forEach(a=>a.onclick=()=>{try{navigator.clipboard.writeText(a.dataset.copy); a.textContent='copied';}catch(e){}});
  box.querySelectorAll('a[data-whya]').forEach(a=>a.onclick=()=>{TS.whyA=a.dataset.whya; TS.whyB=''; showTab('why');});
  fillJourney(box);
}
function edgeLines(n){
  const es=(adj[n.id]||[]).filter(e=>e.kind!=='gold_missed'||S.F.missed);
  return es.slice(0,60).map(e=>{const o=e.s===n.id; const other=byId[o?e.t:e.s]; return '<div>'+(o?'':'← ')+'<a class="lnk" data-e="'+esc(e.id)+'">'+esc(e.rel)+'</a> '+(o?'→ ':'from ')+'<a class="lnk" data-n="'+esc(other.id)+'">'+esc(other.name)+'</a>'+(e.kind==='gold_missed'?' <span class="chip">missed</span>':'')+'</div>';}).join('')+(es.length>60?'<div class="na">… '+(es.length-60)+' more</div>':'');
}
function detNode(n,dbg){
  let h='<h2>'+esc(n.name)+'</h2><span class="chip" style="border-left:4px solid '+typeCol(n.type)+'">'+esc(n.type)+'</span>'+(n.ghost?' <span class="chip">in the answer key, missed by the system</span>':'');
  if(S.mode==='pd'){
    const ringTxt={centre:'one of the most connected, central concepts',inner:'well connected, near the centre',middle:'moderately connected',outer:'few connections, near the edge',unlinked:'found in the text, but not linked to any other concept yet'}[n.ring]||'';
    h+='<dl><dt>Also called</dt><dd>'+(n.aliases.length?n.aliases.map(a=>'<span class="chip">'+esc(a)+'</span>').join(''):'<span class="na">no other names recorded</span>')+'</dd>'+
    '<dt>First appears</dt><dd>chapter '+n.ch+', section '+esc(n.first_section)+' · mentioned '+n.n_mentions+' time'+(n.n_mentions===1?'':'s')+' in '+n.sections.length+' section'+(n.sections.length===1?'':'s')+'</dd>'+
    '<dt>How central it is</dt><dd><b>'+esc(n.ring)+'</b> — '+ringTxt+(dbg?'<br>cluster '+esc(n.comm)+' / '+esc(n.comm_fine):'')+'</dd>'+
    (n.definition!==NA?'<dt>Definition</dt><dd>'+esc(n.definition)+'</dd>':'')+
    '<dt>From the book</dt>'+n.quotes.map(q=>'<dd><div class="sent">'+esc(q.q)+'</div><span class="small">'+esc(q.sec)+' · '+esc(q.role)+'</span></dd>').join('');
    if(dbg) h+='<dt>Ring by chapter</dt><dd>'+Object.entries(n.ring_by_chapter).map(([c,r])=>'ch'+c+': '+esc(r)).join(' → ')+'</dd><dt>Where the other names came from</dt><dd>'+val(n.alias_provenance)+'</dd><dt>Merged from (earlier duplicates)</dt><dd>'+val(n.merged_from)+'</dd><dt>Concept id</dt><dd><code>'+esc(n.id)+'</code>'+copyBtn(n.id)+'</dd>';
    h+='</dl>';
  } else {
    h+=(n.ghost?'':' <span class="chip">'+(n.gold_entity_match?'matches the answer key':'not in the answer key')+'</span>')+'<dl><dt>Text in the document</dt><dd>'+(n.surfaces||[]).map(s=>'<span class="chip">'+esc(s)+'</span>').join('')+'</dd><dt>Sentence</dt><dd><div class="sent">'+highlight(n.sentence,null,n,{})+'</div></dd>';
    if(dbg) h+='<dt>Spans (token start–end)</dt><dd>'+esc((n.spans||[]).map(s=>s[0]+'–'+s[1]).join(', '))+'</dd><dt>Merged concept name</dt><dd>'+val(n.canonical_name)+'</dd><dt>Type also matches the answer key</dt><dd>'+(n.gold_entity_typed_match?'yes':'no')+'</dd><dt>Node id</dt><dd><code>'+esc(n.id)+'</code>'+copyBtn(n.id)+'</dd>';

  h+='<dl><dt>Relations ('+(adj[n.id]||[]).length+')</dt><dd>'+edgeLines(n)+'</dd></dl>';

}
function detEdge(e,dbg){
  const a=byId[e.s], b=byId[e.t], d=defs()[e.rel]||{}, tpl=fillTemplate(e,a,b);
  let h='<h2>'+esc(a.name)+' <span style="border-bottom:3px solid '+(e.kind==='gold_missed'?'#8b919d':relCol(e.rel))+'">— '+esc(e.rel)+' →</span> '+esc(b.name)+'</h2>';

}

function wireSide(s){
  const $$=(q)=>s.querySelectorAll(q), one=(q)=>s.querySelector(q);
  $$('tr[data-d]').forEach(tr=>tr.onclick=()=>{S.sel=null; setMode('sci',DATA.sci.docs.find(d=>d.doc_id===tr.dataset.d));});
  $$('input[data-t]').forEach(i=>i.onchange=()=>{i.checked?S.F.types.add(i.dataset.t):S.F.types.delete(i.dataset.t);draw();});
  $$('input[data-r]').forEach(i=>i.onchange=()=>{i.checked?S.F.rels.add(i.dataset.r):S.F.rels.delete(i.dataset.r);draw();});
  $$('button[data-tour]').forEach(b=>b.onclick=()=>tour(b.dataset.tour));
  $$('button[data-pdrun]').forEach(b=>b.onclick=()=>usePdRun(b.dataset.pdrun));

  const q=one('#f-q'); if(q){ q.oninput=()=>{S.F.query=q.value; const m=S.G.nodes.find(n=>!n.ghost&&n.name.toLowerCase()===q.value.trim().toLowerCase()); if(m){S.kb=true; selectNode(m.id,true);} else draw();}; q.onkeydown=ev=>{ if(ev.key==='Enter'){ const t=S.F.query.trim().toLowerCase(); const m=S.G.nodes.find(n=>!n.ghost&&(n.name.toLowerCase().includes(t)||(n.aliases||[]).some(a=>a.toLowerCase().includes(t)))); if(m) selectNode(m.id,true);} }; }
  const ch=one('#f-ch'); if(ch) ch.onchange=()=>{S.F.chapter=+ch.value; fit(true); hashWrite();};
  const lay=one('#f-lay'); if(lay) lay.onchange=()=>{S.F.layout=lay.value; fit(true);};
  const col=one('#f-col'); if(col) col.onchange=()=>{S.F.colour=col.value; draw();};
  const unl=one('#f-unl'); if(unl) unl.onchange=()=>{S.F.unlinked=unl.checked; fit(true);};
  const ms=one('#f-miss'); if(ms) ms.onchange=()=>{S.F.missed=ms.checked; fit(true);};
  const tp=one('#f-top'); if(tp) tp.oninput=()=>{S.F.top=+tp.value; one('#f-top-v').textContent=tp.value; draw();};
  one('#f-lab').onchange=e=>{S.F.labels=e.target.checked; draw();};
  one('#b-fit').onclick=()=>fit(true);
  one('#b-reset').onclick=()=>{S.F.types=new Set(S.G.nodes.filter(n=>!n.ghost).map(n=>n.type)); S.F.rels=new Set(S.G.edges.map(e=>e.rel)); S.F.query=''; S.F.labels=false; S.F.top=0; S.sel=null; setMode(S.mode,S.doc);};
  one('#b-all').onclick=()=>{$$('input[data-r]').forEach(i=>{i.checked=true;S.F.rels.add(i.dataset.r);}); draw();};
  one('#b-none').onclick=()=>{$$('input[data-r]').forEach(i=>{i.checked=false;S.F.rels.delete(i.dataset.r);}); draw();};
  const x=one('#intro-x'); if(x) x.onclick=()=>{store.set('kg_intro','off'); const c=one('#intro'); if(c) c.style.display='none';};
}
function tour(name){
  if(name==='centre'){ S.F.layout='rings'; S.F.colour='ring'; S.F.chapter=3; S.F.unlinked=false; S.F.top=0.35; side(); fit(true); }
  else if(name==='growth'){ S.F.chapter=1; S.F.layout='force'; S.F.colour='type'; S.F.top=0; side(); fit(true); }
  else if(name==='evidence'){ S.F.layout='force'; S.F.colour='type'; S.F.chapter=3; S.F.top=0; side(); const e=S.G.edges.find(x=>x.rel==='acts_on'&&x.quote&&x.quote!==NA)||S.G.edges[0]; fit(false); selectEdge(e); moveView(targetView([byId[e.s],byId[e.t]]),280); }
  else if(name==='found'){ S.F.missed=false; S.F.colour='gold'; showTab('graph'); side(); fit(true); }
  else if(name==='missed'){ S.F.missed=true; S.F.colour='gold'; showTab('graph'); side(); fit(true); }
  else if(name==='text'){ showTab('doc'); }
}

function tabs(){

}
function showTab(k){
  S.tab=k; ['graph','doc','table',...TRACE_PANES,...EV_PANES].forEach(p=>{const el=$('p-'+p); if(el) el.classList.toggle('on',p===k);});
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));
  if(k==='graph'){ resize(); draw(); } if(k==='doc') renderDoc(); if(k==='table') renderTables(); if(TRACE_PANES.includes(k)) renderTraceTab(k); if(EV_PANES.includes(k)) renderEvalTab(k);
}
function renderDoc(){
  const d=S.doc, goldSet=new Set(d.gold_spans.map(g=>g[0]+'-'+g[1])), predSet=new Map(d.pred_spans.map(p=>[p[0]+'-'+p[1],p[2]]));
  const startAt=new Map(), gOnly=new Map(); d.pred_spans.forEach(p=>startAt.set(p[0],p)); d.gold_spans.forEach(g=>{ if(!predSet.has(g[0]+'-'+g[1])) gOnly.set(g[0],g); });
  let h='<p class="small" style="max-width:900px"><span class="doc"><s class="pg">found, and in the answer key</s> <s class="pf">found, not in the answer key</s> <s class="gm">in the answer key, missed</s></span> Click a highlighted phrase to open it. ' +
    d.pred_spans.filter(p=>goldSet.has(p[0]+'-'+p[1])).length+' of the '+d.pred_spans.length+' phrases it found are in the answer key; it missed '+d.gold_spans.filter(g=>!predSet.has(g[0]+'-'+g[1])).length+' of the '+d.gold_spans.length+' answer-key concepts.</p><div class="doc">';
  let sentI=0, i=0; const T=d.tokens;
  while(i<T.length){
    const p=startAt.get(i), g=gOnly.get(i);
    if(p){ const cls=goldSet.has(p[0]+'-'+p[1])?'pg':'pf'; h+='<s class="'+cls+'" data-n="'+esc(p[2])+'">'+esc(T.slice(p[0],p[1]).join(' '))+'</s> '; i=p[1]; }
    else if(g){ h+='<s class="gm" title="answer key: '+esc(g[2])+'">'+esc(T.slice(g[0],g[1]).join(' '))+'</s> '; i=g[1]; }
    else { h+=esc(T[i])+' '; i++; }
    if(i>=d.sentence_ends[sentI]){ h+='<span class="sentbreak"></span>'; sentI++; }
  }
  $('docview').innerHTML=h+'</div>';
  document.querySelectorAll('#docview s[data-n]').forEach(el=>el.onclick=()=>{ selectNode(el.dataset.n); });
}

function wireTables(el){
  el.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{ if(tr.dataset.kind==='n') selectNode(tr.dataset.id); else if(tr.dataset.kind==='e'){ const e=S.G.edges.find(x=>x.id===tr.dataset.id); if(e) selectEdge(e);} });
  el.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{ const t=th.closest('table'), body=[...t.querySelectorAll('tr[data-id]')], i=[...th.parentNode.children].indexOf(th), num=body.every(r=>r.children[i].textContent===''||!isNaN(+r.children[i].textContent)); const dir=th.dataset.d==='1'?-1:1; th.dataset.d=dir===1?'1':'0'; body.sort((a,b)=>{const x=a.children[i].textContent,y=b.children[i].textContent; return dir*(num?(+x)-(+y):x.localeCompare(y));}).forEach(r=>t.appendChild(r)); });
}

// ---------------------------------------------------------------- input
let drag=null;
cv.addEventListener('pointerdown',ev=>{drag={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y,moved:false}; try{cv.setPointerCapture(ev.pointerId);}catch(e){} cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',ev=>{
  if(drag){ const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; view.x=drag.vx+dx; view.y=drag.vy+dy; draw(); return; }
  const r=cv.getBoundingClientRect(); const n=nodeAt(ev.clientX-r.left,ev.clientY-r.top); if(n!==S.hover){S.hover=n; cv.style.cursor=n?'pointer':'grab'; draw();}
});
cv.addEventListener('pointerup',ev=>{
  const was=drag; drag=null; cv.style.cursor='grab'; if(!was||was.moved) return;
  const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top, n=nodeAt(mx,my);
  if(n){ selectNode(n.id); return; } const e=edgeAt(mx,my); if(e){ selectEdge(e); return; } clearSel();
});
cv.addEventListener('wheel',ev=>{ev.preventDefault(); const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top,f=ev.deltaY<0?1.12:1/1.12; view.x=mx-(mx-view.x)*f; view.y=my-(my-view.y)*f; view.k*=f; draw();},{passive:false});
addEventListener('resize',()=>{resize(); draw();});
addEventListener('keydown',ev=>{
  const tag=(ev.target&&ev.target.tagName)||'';
  if(ev.key==='/'&&tag!=='INPUT'){ ev.preventDefault(); const q=$('f-q'); if(q) q.focus(); return; }
  if(ev.key==='Escape'){ S.kb=true; clearSel(); S.kb=false; return; }
  if(tag==='INPUT'||tag==='SELECT') return;
  if(ev.key==='ArrowRight'){ const nb=neighbours(); if(!nb.length) return; ev.preventDefault(); (S.hist=S.hist||[]).push(S.sel.id); selectNode(nb[0],true); return; }
  if(ev.key==='ArrowLeft'){ const prev=(S.hist||[]).pop(); if(prev&&byId[prev]){ ev.preventDefault(); selectNode(prev,true); } return; }
});
$('m-pd').onclick=()=>setMode('pd'); $('m-sci').onclick=()=>setMode('sci'); $('m-ev').onclick=()=>setMode('ev');
$('v-review').onclick=()=>setView('review'); $('v-debug').onclick=()=>setView('debug');

/*__TRACE_JS__*/
/*__EVAL_JS__*/
// ---------------------------------------------------------------- boot
(function(){
  const h=hashRead(), v=h.v||store.get('kg_view')||'review';
  S.view=(v==='debug')?'debug':'review'; document.body.className=S.view;
  const d=h.d?DATA.sci.docs.find(x=>x.doc_id===h.d):null;
  if(h.ch) S.F.chapter=+h.ch;
  setMode(h.m==='sci'?'sci':(h.m==='ev'?'ev':'pd'), d, false);
  if(h.m!=='sci'&&h.m!=='ev'&&h.ch){ S.F.chapter=+h.ch; side(); fit(false); }
  if(h.s&&S.mode!=='ev'){ const [k,id]=[h.s.slice(0,1),h.s.slice(2)]; if(k==='n'&&byId[id]) selectNode(id); else if(k==='e'){ const e=S.G.edges.find(x=>x.id===id); if(e) selectEdge(e); } }
})();
</script>
