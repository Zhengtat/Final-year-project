    section_id: '4.3'
    answer_id: null
    quote: Given a unicast routing table, each router knows that the current shortest
      path to a given destination goes through NextHop. Thus, whenever it receives
      a multicast packet from source S, the router forwards the packet on all outgoing
      links (except the one on which the packet arrived) if and only if the packet
      arrived over the link that is on the shortest path to S (i.e., the packet came
