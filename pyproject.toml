[project]
name = "cumap"
version = "0.1.0"
description = "H420020 Conceptual Understanding Mapper — expert/student knowledge graph diagnosis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1",
    "pandas>=2",
    "pyarrow>=15",
    "datasets>=2",
    "networkx>=3",
    "spacy>=3.7",
    "scikit-learn>=1.4",
    "sentence-transformers>=3",
    "openai>=1.50",
    "tenacity>=8",
    "diskcache>=5",
    "streamlit>=1.35",
    "pyvis>=0.3",
    "rich>=13",
]

[project.scripts]
cumap = "cumap.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cumap"]
